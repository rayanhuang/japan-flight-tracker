grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">${idxs.map(ci=>{let best=Infinity,bestW=0,bestItem=null;W.forEach((w,wi)=>{const it=w[3][ci];const p=priceWithBag(it[0],it[3]);if(p<best){best=p;bestW=wi;bestItem=it;}});const d=bestItem[0]-bestItem[1];return `<div class="glass rounded-2xl p-5 space-y-3"><div class="flex items-center justify-between"><div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full" style="background:${C[ci][3]}"></span><h3 class="font-bold text-white">${C[ci][1]}</h3></div>${diffBadge(d)}</div><div class="text-3xl font-extrabold text-white">${fmt(best)}</div><div class="text-xs text-slate-400 space-y-1"><div>最低窗口：<span class="text-slate-200">${W[bestW][1]}</span></div><div>航空公司：<span class="text-slate-200">${bestItem[2]}</span></div><div>11/17 基準：${fmt(priceWithBag(bestItem[1],bestItem[3]))}</div></div></div>`;}).join('')}</div>`;}function renderTab1(){const idxs=state.city===-1?[0,1,2,3,4,5,6]:[state.city];return `<div class="space-y-4">${W.map(w=>`<div class="glass rounded-2xl p-5 space-y-3"><div class="flex flex-wrap items-center justify-between gap-2"><h3 class="text-base font-bold text-white">${w[1]}</h3><span class="text-xs text-slate-400">桃園 (TPE) 直飛來回含稅</span></div><div class="overflow-x-auto"><table class="w-full text-sm text-left"><thead class="text-xs text-slate-400 border-b border-white/10"><tr><th class="py-2 pr-4">航點</th><th class="py-2 px-3">11/18 最低價</th><th class="py-2 px-3">11/17 基準</th><th class="py-2 px-3">漲跌</th><th class="py-2 pl-3">航空 / 備註</th></tr></thead><tbody>${idxs.map(ci=>{const it=w[3][ci];const p18=priceWithBag(it[0],it[3]);const p17=priceWithBag(it[1],it[3]);return `<tr><td class="py-2.5 pr-4 font-medium text-white flex items-center gap-2"><span class="w-2 h-2 rounded-full" style="background:${C[ci][3]}"></span>${C[ci][1]}</td><td class="py-2.5 px-3 font-bold text-emerald-300">${fmt(p18)}</td><td class="py-2.5 px-3 text-slate-400">${fmt(p17)}</td><td class="py-2.5 px-3">${diffBadge(it[0]-it[1])}</td><td class="py-2.5 pl-3 text-xs text-slate-300">${it[2]}</td></tr>`;}).join('')}</tbody></table></div></div>`).join('')}</div>`;}function renderTab2(){const btns=['窗口比價圖','每日追蹤折線','5天票價日曆趨勢'].map((b,i)=>`<button onclick="state.chartMode=${i};render()" class="px-3 py-1.5 rounded-lg text-xs font-medium transition ${state.chartMode===i?'bg-emerald-500 text-slate-950 font-semibold':'glass-sm text-slate-300'}">${b}</button>`).join('');const idxs=state.city===-1?[0,1,2,3,4,5,6]:[state.city];const rows=[...state.logs].reverse().map((l,ri,arr)=>{const prev=arr[ri+1];return `<tr><td class="py-2.5 px-3 font-medium text-white whitespace-nowrap">${l.date}</td><td class="py-2.5 px-3 text-xs text-slate-300 whitespace-nowrap">${W[l.win][2]}</td>${idxs.map(ci=>{const p=priceWithBag(l.prices[ci],W[l.win][3][ci][3]);const d=prev?l.prices[ci]-prev.prices[ci]:0;return `<td class="py-2.5 px-3 whitespace-nowrap"><div class="font-semibold text-slate-100">${fmt(p)}</div>${prev?`<div class="mt-0.5">${diffBadge(d)}</div>`:''}</td>`;}).join('')}</tr>`;}).join('');return `<div class="glass rounded-2xl p-5 space-y-4"><div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3"><div><h2 class="text-base md:text-lg font-bold text-white">2027 年 5–10 月已開賣請假窗口七大航點票價對比</h2><p class="text-xs text-slate-400 mt-0.5">桃園 (TPE) 直飛來回含稅最低價（熊本為星宇/華航傳統航空已含行李）</p></div><div class="flex flex-wrap gap-2">${btns}</div></div><div class="h-80 md:h-96 w-full"><canvas id="mainChart"></canvas></div><div class="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-white/10 text-xs text-slate-400"><span>已自動寫入 2026-11-17 與 2026-11-18 兩日真實巡檢紀錄。</span><div class="flex items-center gap-4"><a href="https://www.skyscanner.com.tw/" target="_blank" rel="noopener" class="text-emerald-400 hover:underline">Skyscanner 即時比價 ↗</a><a href="https://www.dgpa.gov.tw/" target="_blank" rel="noopener" class="text-sky-400 hover:underline">2027 連假行事曆 ↗</a></div></div></div><div class="glass rounded-2xl p-5 space-y-4"><div class="flex flex-wrap items-center justify-between gap-3"><h3 class="text-base font-bold text-white">每日查價與漲跌紀錄簿</h3><div class="flex flex-wrap gap-2"><button onclick="simNextDay()" class="px-3 py-1.5 rounded-lg glass-sm text-xs text-sky-300">模擬隔日更新</button><button onclick="exportCSV()" class="px-3 py-1.5 rounded-lg glass-sm text-xs text-emerald-300">匯出 CSV</button><button onclick="resetLogs(true)" class="px-3 py-1.5 rounded-lg glass-sm text-xs text-rose-300">重置為 11/17 初始基準</button></div></div><div class="overflow-x-auto"><table class="w-full text-sm text-left"><thead class="text-xs text-slate-400 border-b border-white/10"><tr><th class="py-2 px-3">巡檢日期</th><th class="py-2 px-3">追蹤窗口</th>${idxs.map(ci=>`<th class="py-2 px-3 whitespace-nowrap">${C[ci][2]}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div></div>`;}function renderTab3(){const links=[['台灣虎航 Tigerair','https://www.tigerairtw.com/'],['星宇航空 STARLUX','https://www.starlux-airlines.com/'],['中華航空 China Airlines','https://www.china-airlines.com/'],['長榮航空 EVA Air','https://www.evaair.com/'],['酷航 Scoot','https://www.flyscoot.com/'],['AirAsia','https://www.airasia.com/'],['Skyscanner 比價','https://www.skyscanner.com.tw/']];return `<div class="grid grid-cols-1 md:grid-cols-2 gap-4"><div class="glass rounded-2xl p-5 space-y-3"><h3 class="text-base font-bold text-white">篩選與自動巡檢規則</h3><ul class="text-sm text-slate-300 space-y-2" style="padding-left:1.2rem"><li>出發地限定：桃園國際機場 (TPE) 直飛來回含稅最低價</li><li>請假條件：請假 ≤ 3 天，湊滿 5–6 天連休窗口</li><li>航班時間：回程落地時間 ≤ 22:00（隔天可正常上班）</li><li>託運計算：勾選「廉航加計 20kg 託運」時廉航自動 +NT$2,000，傳統航空不另加價</li></ul></div><div class="glass rounded-2xl p-5 space-y-3"><h3 class="text-base font-bold text-white">官網與即時比價直達</h3><div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">${links.map(l=>`<a href="${l[1]}" target="_blank" rel="noopener" class="glass-sm px-3.5 py-2.5 rounded-xl text-sm text-slate-200 flex items-center justify-between"><span>${l[0]}</span><span class="text-xs text-slate-400">↗</span></a>`).join('')}</div></div></div>`;}function drawChart(){const el=document.getElementById('mainChart');if(!el)return;if(chart)chart.destroy();const idxs=state.city===-1?[0,1,2,3,4,5,6]:[state.city];let cfg;if(state.chartMode===0){cfg={type:'bar',data:{labels:W.map(w=>w[2]),datasets:idxs.map(ci=>({label:C[ci][2],data:W.map(w=>priceWithBag(w[3][ci][0],w[3][ci][3])),backgroundColor:C[ci][3]+'cc',borderColor:C[ci][3],borderWidth:1,borderRadius:6}))}};}else if(state.chartMode===1){cfg={type:'line',data:{labels:state.logs.map(l=>l.date),datasets:idxs.map(ci=>({label:C[ci][2],data:state.logs.map(l=>priceWithBag(l.prices[ci],W[l.win][3][ci][3])),borderColor:C[ci][3],backgroundColor:C[ci][3]+'33',tension:.3,pointRadius:4,borderWidth:2.5}))}};}else{cfg={type:'line',data:{labels:CAL_D,datasets:idxs.map(ci=>({label:C[ci][2],data:CAL_P[ci].map(p=>priceWithBag(p,ci===5?1:0)),borderColor:C[ci][3],backgroundColor:C[ci][3]+'22',tension:.3,pointRadius:3,borderWidth:2}))}};}cfg.options={responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{labels:{color:'#cbd5e1',boxWidth:12,font:{size:11}}},tooltip:{backgroundColor:'rgba(15,23,42,.95)',titleColor:'#fff',bodyColor:'#e2e8f0',borderColor:'rgba(255,255,255,.15)',borderWidth:1,callbacks:{label:c=>`${c.dataset.label}: ${fmt(c.parsed.y)}`}}},scales:{x:{ticks:{color:'#94a3b8',font:{size:11}},grid:{color:'rgba(255,255,255,.05)'}},y:{ticks:{color:'#94a3b8',font:{size:11},callback:v=>'NT$'+v.toLocaleString()},grid:{color:'rgba(255,255,255,.06)'}}}};chart=new Chart(el,cfg);}function render(){renderBars();const m=document.getElementById('mainContent');if(state.tab===0)m.innerHTML=renderTab0();else if(state.tab===1)m.innerHTML=renderTab1();else if(state.tab===2){m.innerHTML=renderTab2();drawChart();}else m.innerHTML=renderTab3();}function simNextDay(){const last=state.logs[state.logs.length-1];const d=new Date(last.date);d.setDate(d.getDate()+1);const nd=d.toISOString().slice(0,10);const np=last.prices.map(p=>Math.max(4500,p+(Math.floor(Math.random()*9)-4)*50));state.logs.push({date:nd,win:last.win,prices:np});localStorage.setItem(KEY,JSON.stringify(state.logs));render();}function exportCSV(){const hdr=['日期','窗口',...C.map(c=>c[2])].join(',');const rows=state.logs.map(l=>[l.date,W[l.win][1],...l.prices.map((p,ci)=>priceWithBag(p,W[l.win][3][ci][3]))].join(','));const blob=new Blob(['\uFEFF'+hdr+'\n'+rows.join('\n')],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='japan-flight-tracker.csv';a.click();}function openModal(){const m=document.getElementById('logModal');m.classList.remove('hidden');m.classList.add('flex');const last=state.logs[state.logs.length-1];const d=new Date(last.date);d.setDate(d.getDate()+1);document.getElementById('mDate').value=d.toISOString().slice(0,10);document.getElementById('mWin').innerHTML=W.map((w,i)=>`<option value="${i}">${w[1]}</option>`).join('');fillModalDefaults();}function fillModalDefaults(){const wi=Number(document.getElementById('mWin').value);document.getElementById('mCities').innerHTML=C.map((c,ci)=>`<div><label class="text-xs text-slate-400 mb-1" style="display:block">${c[2]}</label><input type="number" id="mc_${ci}" value="${W[wi][3][ci][0]}" class="w-full px-2 py-1.5 rounded-lg bg-slate-900/80 border border-white/10 text-sm text-white"></div>`).join('');}function closeModal(){const m=document.getElementById('logModal');m.classList.add('hidden');m.classList.remove('flex');}function saveModal(){const date=document.getElementById('mDate').value;const win=Number(document.getElementById('mWin').value);const prices=C.map((_,ci)=>Number(document.getElementById('mc_'+ci).value)||0);state.logs.push({date,win,prices});localStorage.setItem(KEY,JSON.stringify(state.logs));closeModal();render();}document.getElementById('bagToggle').addEventListener('change',e=>{state.bag=e.target.checked;render();});initLogs();render();</script></body></html>
